<!doctype html>
<!-- Solo para desarrollo: carga datos de ejemplo y abre Rumbo en un marco.
     Parámetros: ?tab=hoy&theme=dark&night=0&onb=1&scroll=0&do=selector1,wait800,selector2&keep=1
     Funciona solo en localhost para no pisar datos reales. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rumbo demo</title>
  <style>html, body { margin: 0; height: 100%; background: #000; } iframe { border: 0; width: 100%; height: 100%; display: block; }</style>
</head>
<body>
  <iframe id="f" title="Rumbo"></iframe>
  <script>
    const p = new URLSearchParams(location.search);
    const local = ['localhost', '127.0.0.1'].includes(location.hostname);
    const pad = n => String(n).padStart(2, '0');
    const key = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const add = n => { const d = new Date(); d.setDate(d.getDate() + n); return key(d); };

    function seed() {
      let id = 0;
      const T = (title, date, o = {}) => ({ id: 't' + (++id), title, date, time: null, duration: null, important: false, done: false, doneAt: null, notes: '', category: null, subtasks: [], routineId: null, createdAt: Date.now() - id * 1000, ...o });
      const s = {
        version: 2, onboarded: p.get('onb') !== '0', tasks: [], routines: [], routineSkips: {}, water: {}, focusLog: {}, journal: {}, planned: {}, exported: {}, guide: { 'install.0': true, 'block.0': true, 'block.1': true }, hideInstall: p.get('install') !== '1', focus: null,
        settings: { name: 'Camilo', theme: p.get('theme') || 'auto', accent: p.get('accent') || 'indigo', waterGoalMl: 2000, glassMl: 250, waterStart: '08:00', waterEnd: '21:00', waterEvery: 120, focusGoal: 60, focusDefault: 25, nightMode: p.get('night') === '1', nightStart: '23:00', nightEnd: '06:00', planTime: p.get('plan') || '21:30', leadMin: 5 },
      };
      s.tasks = [
        T('Gimnasio', add(0), { time: '06:30', duration: 60, category: 'salud', done: true }),
        T('Revisar correos', add(0), { time: '08:00', duration: 30, category: 'trabajo', done: true }),
        T('Reunión con el equipo', add(0), { time: '10:00', duration: 60, category: 'trabajo', important: true }),
        T('Almuerzo con Laura', add(0), { time: '13:00', duration: 60, category: 'personal' }),
        T('Terminar la presentación', add(0), { time: '15:00', duration: 90, category: 'trabajo', important: true, subtasks: [{ id: 's1', title: 'Diapositivas', done: true }, { id: 's2', title: 'Ensayar en voz alta', done: false }], notes: 'Enviar a Andrés antes de las 6 pm.' }),
        T('Comprar mercado', add(0), { category: 'hogar' }),
        T('Llamar a mamá', add(0), { important: true }),
        T('Leer 20 páginas', add(0), { done: true, category: 'estudio' }),
        T('Pagar el internet', add(-1), {}),
        T('Correr 5 km', add(1), { time: '06:30', duration: 45, category: 'salud' }),
        T('Clase de inglés', add(1), { time: '18:00', duration: 90, category: 'estudio', important: true }),
        T('Renovar el pasaporte', null, { category: 'personal' }),
        T('Organizar el clóset', null, { category: 'hogar' }),
        T('Aprender a hacer pan', null, {}),
        T('Cotizar seguro del carro', null, { category: 'trabajo', important: true }),
        T('Dentista', add(3), { time: '16:00', duration: 60, category: 'salud' }),
        T('Cumpleaños de Sofía', add(5), { important: true, category: 'personal' }),
      ];
      const w = [1750, 2250, 1500, 2000, 2500, 1250, 1000], f = [45, 90, 25, 60, 75, 30, 25], moods = [4, 5, 3, 4, 5, 2];
      for (let i = 0; i < 30; i++) {
        const k = add(-i);
        s.water[k] = i < 7 ? w[i] : 1000 + ((i * 7) % 6) * 250;
        s.focusLog[k] = i < 7 ? f[i] : ((i * 5) % 6) * 15;
        if (i > 0 && i < 9) s.planned[add(-i + 1)] = Date.now();
      }
      const counts = [5, 4, 6, 3, 5, 4];
      for (let i = 1; i < 7; i++) {
        const k = add(-i);
        s.journal[k] = { mood: moods[i - 1], note: i === 1 ? 'Terminé el informe antes de tiempo y salí a caminar al atardecer.' : i === 3 ? 'Me costó concentrarme; mañana empiezo más temprano.' : '' };
        for (let j = 0; j < counts[i - 1]; j++) s.tasks.push(T('Tarea ' + j, k, { done: true }));
      }
      // Ánimo (energía × agrado) de las últimas semanas y un recuerdo de hace un año.
      const feels = [[4, 4], [2, 5], [3, 4], [4, 2], [5, 5], [1, 2], [2, 4], [3, 3], [4, 5], [2, 2], [5, 4], [1, 5], [3, 4], [4, 4], [2, 3], [3, 5], [5, 3], [1, 4], [4, 1], [2, 5]];
      for (let i = 0; i < 60; i++) {
        if (i % 7 === 6) continue;
        const k = add(-i - 1), fe = feels[i % feels.length];
        s.journal[k] = { ...(s.journal[k] || { note: '' }), feel: { e: fe[0], p: fe[1] }, mood: fe[1] };
      }
      const yearAgo = (() => { const d = new Date(); d.setFullYear(d.getFullYear() - 1); return key(d); })();
      s.journal[yearAgo] = { feel: { e: 4, p: 5 }, mood: 5, note: 'Primer día en el gimnasio nuevo. Terminé sin aire, pero feliz.' };
      s.routines = [{ id: 'r1', title: 'Meditar 10 min', time: null, duration: 15, days: [0, 1, 2, 3, 4, 5, 6], category: 'salud' }];
      // Noches de ejemplo (hora de acostarse → despertar), guardadas en el día en que despertó.
      const at = (k, h, m) => { const d = new Date(k + 'T00:00'); d.setHours(h, m, 0, 0); return d.getTime(); };
      const beds = [[23, 10], [23, 45], [22, 50], [0, 20], [23, 5], [23, 30]], wakes = [[6, 30], [6, 40], [6, 25], [7, 10], [6, 35], [6, 30]];
      s.sleep = { alarm: null, bed: null, log: {} };
      for (let i = 0; i < 6; i++) {
        const k = add(-i), b = beds[i], w = wakes[i];
        if (at(k, w[0], w[1]) > Date.now()) continue;
        s.sleep.log[k] = { bed: b[0] < 12 ? at(k, b[0], b[1]) : at(add(-i - 1), b[0], b[1]), wake: at(k, w[0], w[1]), errors: i % 3 === 0 ? 1 : 0, secs: 70 + i * 9 };
      }
      // cf=1: CrossFit con historial (hombre, 178 cm).
      if (p.get('cf') === '1') {
        let n = 0;
        const L = (lift, d, lb, reps) => ({ id: 'l' + (++n), lift, date: add(d), lb, reps, note: '' });
        s.cf = {
          profile: { sex: 'm', heightCm: 178 },
          lifts: [L('deadlift', -60, 315, 1), L('deadlift', -30, 335, 1), L('deadlift', -3, 345, 2), L('backsquat', -40, 255, 3), L('backsquat', -10, 275, 1),
            L('bench', -20, 205, 5), L('press', -15, 135, 3), L('snatch', -25, 155, 1), L('snatch', -5, 165, 1), L('cleanjerk', -8, 215, 1), L('frontsquat', -12, 225, 2)],
          complexes: [{ id: 'c1', name: 'Clean + Front squat + Jerk', date: add(-18), lb: 185, note: '' }, { id: 'c2', name: 'Clean + Front squat + Jerk', date: add(-4), lb: 195, note: '' }],
          weekGoal: 4,
          wods: [{ id: 'w1', wod: 'fran', date: add(-9), rx: true, secs: 278, note: '' }],
          sessions: [-1, -2, -4, -5, -7, -8, -10, -11, -12, -15, -16, -18, -19, -22, -23, -25, -29, -30, -32, -36, -37, -39, -40, -43, -44, -46, -47, -50, -51, -53].map((dd, i) => ({
            id: 's' + i, date: add(dd), rpe: [7, 8, 5, 9, 6, 7, 4, 8, 7, 6][i % 10], note: '',
            wod: ['AMRAP 15 min\n10 burpees\n15 wall balls 20 lb\n20 double-unders', 'EMOM 12 min\nmin 1: 3 power cleans 185 lb\nmin 2: 12 toes-to-bar', 'For time\n50-40-30-20-10\nDouble-unders\nSit-ups', '5 rondas\n400 m run\n15 kettlebell swings 53 lb'][i % 4],
            result: ['6 rondas + 12', 'Completo · Rx', '11:42', '18:05 · Rx'][i % 4],
          })),
          body: [[-90, 86.4, 94], [-60, 85.1, 92.5], [-30, 83.9, 91], [-2, 82.6, 89.5]].map(([d, kg, waist], i) => ({ id: 'b' + i, date: add(d), kg, waist, neck: 39, hip: null, photo: null })),
        };
      }
      // alarm=-1: la alarma sonó hace 1 minuto (la misión aparece); alarm=30: suena en 30 minutos.
      if (p.get('alarm')) {
        const d = new Date(Date.now() + Number(p.get('alarm')) * 60e3);
        const hh = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        s.sleep.alarm = { key: add(0), time: hh, backup: 10, setAt: Date.now() - 8 * 3600e3 };
        s.wakeFor = { ...(s.wakeFor || {}), [add(0)]: hh };
        s.sleep.bed = { key: add(0), at: Date.now() - 7.4 * 3600e3 };
        delete s.sleep.log[add(0)];
      }
      if (p.get('planned') === '0') { delete s.planned[add(0)]; delete s.planned[add(1)]; }
      if (p.get('empty') === '1') { s.tasks = []; s.water = {}; s.focusLog = {}; s.journal = {}; s.planned = {}; s.routines = []; }
      localStorage.setItem('rumbo.v1', JSON.stringify(s));
      sessionStorage.setItem('rumbo.fired', JSON.stringify(['*']));
    }

    // ?photos=1: fotos de ejemplo (dibujadas al vuelo) en varios días.
    async function seedPhotos() {
      const { savePhoto, photoKeys, deletePhoto } = await import('../js/photos.js');
      for (const k of await photoKeys()) await deletePhoto(k);
      const s = JSON.parse(localStorage.getItem('rumbo.v1'));
      const yearAgo = (() => { const d = new Date(); d.setFullYear(d.getFullYear() - 1); return key(d); })();
      const days = [add(0), add(-1), add(-2), add(-4), add(-5), add(-8), add(-9), add(-11), add(-15), add(-16), add(-19), yearAgo];
      const hues = [24, 200, 330, 140, 45, 260, 12, 180, 300, 90, 210, 35];
      for (let i = 0; i < days.length; i++) {
        const c = document.createElement('canvas'); c.width = 1200; c.height = 900;
        const g = c.getContext('2d'), h = hues[i];
        const sky = g.createLinearGradient(0, 0, 0, 900);
        sky.addColorStop(0, `hsl(${h}, 70%, 62%)`); sky.addColorStop(1, `hsl(${(h + 40) % 360}, 75%, 30%)`);
        g.fillStyle = sky; g.fillRect(0, 0, 1200, 900);
        g.fillStyle = `hsla(${(h + 180) % 360}, 90%, 85%, .9)`; g.beginPath(); g.arc(300 + i * 60, 330, 110, 0, Math.PI * 2); g.fill();
        g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.moveTo(0, 900); g.lineTo(0, 640); g.quadraticCurveTo(400, 480 + i * 10, 760, 650); g.quadraticCurveTo(1000, 560, 1200, 600); g.lineTo(1200, 900); g.fill();
        const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .85));
        const at = await savePhoto(days[i], blob);
        s.journal[days[i]] = { mood: null, feel: null, note: '', ...(s.journal[days[i]] || {}), photo: at };
      }
      s.journal[add(0)] = { ...s.journal[add(0)], feel: { e: 4, p: 4 }, mood: 4, note: 'Atardecer increíble saliendo del trabajo. Llamé a mi mamá.' };
      localStorage.setItem('rumbo.v1', JSON.stringify(s));
    }

    (async () => {
    if (local && p.get('keep') !== '1') { seed(); if (p.get('photos')) await seedPhotos(); }
    const f = document.getElementById('f');
    if (p.get('w')) f.style.width = p.get('w') + 'px';
    if (p.get('h')) f.style.height = p.get('h') + 'px';
    f.src = `../index.html#${p.get('tab') || 'hoy'}`;
    f.onload = () => {
      const steps = (p.get('do') || '').split(',').filter(Boolean);
      const doc = f.contentDocument;
      const next = () => {
        if (!steps.length) { if (p.get('scroll')) f.contentWindow.scrollTo(0, Number(p.get('scroll'))); return; }
        const s = steps.shift();
        if (s.startsWith('wait')) { setTimeout(next, Number(s.slice(4))); return; }
        if (s.startsWith('scroll')) { f.contentWindow.scrollTo(0, Number(s.slice(6))); setTimeout(next, 300); return; }
        if (s.startsWith('type:')) {
          const [sel, text] = s.slice(5).split('=');
          const el = doc.querySelector(sel);
          if (el) { el.value = text; el.dispatchEvent(new Event('input', { bubbles: true })); }
          setTimeout(next, 400);
          return;
        }
        const el = doc.querySelector(s);
        if (el) el.click(); else console.warn('No encontrado:', s);
        setTimeout(next, 800);
      };
      setTimeout(next, 700);
    };
    })();
  </script>
</body>
</html>
